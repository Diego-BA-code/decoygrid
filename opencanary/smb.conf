[global]
    workgroup = WORKGROUP
    server string = SRV-FILES
    netbios name = SRV-FILES
    dns proxy = no
    log file = /var/tmp/samba/log.smbd
    log level = 0
    max log size = 1000
    server role = standalone server
    passdb backend = tdbsam
    map to guest = bad user
    usershare allow guests = yes
    load printers = no
    vfs objects = full_audit
    full_audit:prefix = %U|%I|%i|%m|%S|%L|%R|%a|%T|%D
    full_audit:success = flistxattr
    full_audit:failure = none
    full_audit:facility = local7
    full_audit:priority = notice

[IT]
    comment = Documentos del departamento
    path = /samba/IT
    guest ok = yes
    read only = yes
    browseable = yes

[backup]
    comment = Respaldos
    path = /samba/backup
    guest ok = yes
    read only = yes
    browseable = yes
